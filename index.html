<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<header class="hero">
    <h1 class="logo">GM</h1>
    <p class="name">Gautham</p>
</header>

<main class="container">

    <!-- Life -->
    <div class="card">
        <button class="accordion">⏳ Life</button>
        <div class="panel">
            <p>📅 8 March 2010</p>
            <p>✨ 16</p>
            <p>∞ Journey Continues...</p>
            <button class="close-btn">🔼 See Less</button>
        </div>
    </div>

    <!-- Studies -->
    <div class="card">
        <button class="accordion">📚 Studies</button>
        <div class="panel">
            <p>🏫 School: ...</p>
            <p>📍 Kerala, India</p>
            <p>🎯 Currently Studying</p>
            <button class="close-btn">🔼 See Less</button>
        </div>
    </div>

    <!-- Love -->
    <div class="card">
        <button class="accordion">❤️</button>
        <div class="panel">
            <h2>❤️</h2>
            <p>.......error......</p>
            <button class="close-btn">🔼 See Less</button>
        </div>
    </div>

    <!-- Games -->
    <div class="card">
        <button class="accordion">🎮 Games</button>
        <div class="panel">
            <p>⛏️ Minecraft</p>
            <p>🚗 Need for Speed: Most Wanted</p>
            <p>⚽ eFootball</p>
            <button class="close-btn">🔼 See Less</button>
        </div>
    </div>

</main>

<footer>
    <p>GM © 2026</p>
    <p>Made by GM</p>
</footer>

<script src="script.js"></script>

</body>
</html>
